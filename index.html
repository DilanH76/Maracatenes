<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maracatènes</title>
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body>
    <header>
      <h1>Maracatènes</h1>
      <h2>Le Marathon événement de l'année au Havre</h2>
      <h3>Départ de la Catène le dimanche 31 mai 2026 à 09h00</h3>

      <!--<button id="theme-toggle" class="btn-theme">🌙</button>-->

      <div class="registration-mode">
        <input type="radio" name="mode" id="choix-solo" value="solo" checked onchange="switchMode('solo')">
        <label for="choix-solo" class="mode-btn">
        👤 Solo
        </label>
        <input type="radio" name="mode" id="choix-team" value="team" onchange="switchMode('team')">
        <label for="choix-team" class="mode-btn">
        👥 Équipe
        </label>
      </div>
    </header>

    <div class="main-container">
      <section class="forms-section">
        <form id="main-form">
          
          <div id="participants-container"></div>

          <div class="controls">
            <button type="button" id="btn-add-participant" class="btn-add">
              + Ajouter un participant
            </button>
          </div>
        </form>
      </section>

      <aside>
        <h2>Panier</h2>
        <div class="cart-details" id="cart-details">
          <p>Aucun participant</p>
        </div>

        <hr />

        <div class="cart-total">
          <p>Total à payer : <span id="total-price">0</span>€</p>
        </div>

        <div class="cart-actions">
          <button type="button" class="btn-validate">Valider et payer</button>
          <button type="button" class="btn-cancel">Annuler</button>
        </div>
      </aside>
    </div>

    <button id="btn-back-to-top" title="Retour en haut">⬆️</button>

    <script src="script.js"></script>
  </body>
</html>
